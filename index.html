<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta property="og:title" content="GeniFlare 天才之火 · 数字器官与医学智能平台" />
<meta property="og:description" content="用数字器官连接 AI、医生、再生医学与新药研发。可交互的专业演示（示例数据）。" />

<!-- 字体全部使用系统字体：Google Fonts 在中国大陆常被屏蔽，会拖慢微信内首屏。 -->
<style>
:root{
  --paper:#f0ece2; --paper-2:#f7f4ec; --ink:#191814; --ink-2:#55524a; --mute:#7d7767; --rule:#d6cfbe; --rule-2:#b9b19b;
  --bronze:#76663f; --accent:#1f6b5c; --down:#9b2f22;
  --dk:#191814; --dk-2:#22211b; --dk-rule:#3a382f; --bone:#ece6d6; --bone-2:#b3ac98; --flare:#e88c42;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,SimSun,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",Roboto,Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --gut:20px; color-scheme:light;
}
body[data-lang="zh"]{--serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",STSong,"Iowan Old Style",Georgia,SimSun,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
section,footer{scroll-margin-top:64px}
.wrap{width:min(1120px,100% - 2*var(--gut));margin-inline:auto}
@media (min-width:800px){:root{--gut:40px}}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eb{font:500 11px/1.5 var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--bronze)}
body[data-lang="zh"] .eb{letter-spacing:.14em}
.hs{font-family:var(--serif);font-weight:400;letter-spacing:-.03em;line-height:1.05;text-wrap:balance}
body[data-lang="zh"] .hs{letter-spacing:-.01em;line-height:1.24;font-weight:500}
.lede{font-size:17px;color:var(--ink-2);max-width:56ch;line-height:1.65}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;background:var(--ink);color:var(--bone);border:1px solid var(--ink);font:700 13px var(--sans);letter-spacing:.05em;text-align:center}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.light{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.btn.block{display:flex;width:100%}
.lnk{display:inline-flex;align-items:center;gap:8px;min-height:44px;font:500 14px var(--sans);border-bottom:1px solid var(--ink);padding:0 0 4px;align-self:flex-start}

/* header */
.hd{position:sticky;top:0;z-index:50;background:var(--paper);border-bottom:1px solid var(--rule)}
.hd .wrap{display:flex;align-items:center;height:64px;gap:16px}
.wm{font:700 13px var(--sans);letter-spacing:.3em}
.hd-r{margin-left:auto;display:flex;align-items:center;gap:6px}
.lang{display:flex;align-items:center;font:500 12px var(--sans);color:var(--mute)}
.lang button{min-width:44px;min-height:44px;display:grid;place-items:center;color:var(--mute);font-weight:500}
.lang button.on{color:var(--ink);font-weight:700}
.req{display:none;min-height:44px;padding:0 16px;border:1px solid var(--ink);font:500 13px var(--sans)}
.menu{min-height:44px;padding:0 4px 0 10px;font:500 13px var(--sans);letter-spacing:.06em}
@media (min-width:800px){.req{display:inline-flex;align-items:center}.hd-r{gap:14px}}

/* hero */
.hero{padding:56px 0 44px}
.hero h1{font-size:clamp(44px,13.4vw,96px);margin-top:22px;max-width:14ch}
body[data-lang="zh"] .hero h1{font-size:clamp(36px,10.6vw,80px);max-width:12em}
.hero .lede{margin-top:26px}
.hero .cta{display:flex;flex-direction:column;gap:20px;margin-top:34px;align-items:stretch}
.pilot{display:flex;gap:10px;align-items:center;margin-top:46px;font:400 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.pilot i{width:7px;height:7px;border-radius:50%;background:var(--bronze);flex:none}
@media (min-width:800px){.hero{padding:96px 0 72px}.hero .cta{flex-direction:row;align-items:center;gap:32px}.hero .btn{min-width:260px}}

/* organ band */
.band{background:var(--dk);color:var(--bone)}
.stage{position:relative;height:min(96vw,580px)}
.stage canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.stage .or{position:absolute;font:400 11px var(--mono);color:var(--bone-2);pointer-events:none}
.stage .or.s{top:14px;left:50%;transform:translateX(-50%)} .stage .or.i{bottom:64px;left:50%;transform:translateX(-50%)}
.stage .or.l{right:var(--gut);top:50%} .stage .or.r{left:var(--gut);top:50%}
.stage .hint{position:absolute;top:14px;right:var(--gut);font:400 11px var(--mono);letter-spacing:.1em;color:var(--bone-2);pointer-events:none}
.vmode{position:absolute;left:var(--gut);bottom:14px;display:flex;gap:6px}
.vmode button,.legend{font:500 11px var(--mono);letter-spacing:.06em}
.vmode button{min-height:36px;padding:0 12px;border:1px solid var(--dk-rule);color:var(--bone-2);background:rgba(25,24,20,.6)}
.vmode button.on{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.legend{position:absolute;right:var(--gut);bottom:20px;display:flex;align-items:center;gap:8px;color:var(--bone-2);pointer-events:none}
.legend i{display:block;width:64px;height:5px;background:linear-gradient(90deg,#1e3a36,#567868 35%,#d6c6a0 60%,#e88c42 80%,#ffd68c)}
.cap{background:#12110e;padding:16px 0;font:400 11px/1.6 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--bone-2)}
@media (max-width:520px){.legend{right:auto;left:var(--gut);bottom:auto;top:14px}.legend i{width:40px}.legend span:first-child{display:none}.stage .or.i{bottom:60px}}

/* sequence */
.seq li{display:grid;grid-template-columns:44px 1fr;align-items:baseline;padding:28px 0;border-bottom:1px solid var(--rule)}
.seq .n{font:400 11px var(--mono);color:var(--mute)}
.seq .t{font:400 clamp(24px,6vw,34px)/1.2 var(--serif);letter-spacing:-.01em}
body[data-lang="zh"] .seq .t{font-weight:500}

/* category */
.sec{padding:84px 0}
.sec h2{font-size:clamp(34px,9.6vw,64px);margin-top:20px;max-width:16ch}
body[data-lang="zh"] .sec h2{font-size:clamp(30px,8.4vw,54px);max-width:14em}
.sec .lede{margin-top:24px}
.steps{margin-top:44px;border-top:1px solid var(--rule)}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:4px 0;padding:26px 0;border-bottom:1px solid var(--rule)}
.steps .n{font:400 11px var(--mono);color:var(--mute);padding-top:8px}
.steps h3{font:400 24px/1.25 var(--serif);letter-spacing:-.01em}
body[data-lang="zh"] .steps h3{font-weight:500}
.steps p{grid-column:2;color:var(--ink-2);max-width:52ch}
@media (min-width:800px){.steps{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--rule)}.steps li{display:block;padding:28px 28px 32px 0;border-bottom:0}.steps .n{display:block;padding:0 0 14px}}

/* demo card */
.demo-hd{max-width:760px}
.card{margin-top:44px;border:1px solid var(--ink);background:var(--paper-2)}
.card-hd{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--ink);font:400 11px var(--mono);letter-spacing:.14em;text-transform:uppercase}
.pf{display:flex;border-bottom:1px solid var(--rule)}
.pf button{flex:1;min-height:52px;text-align:center;font:500 14px var(--sans);color:var(--mute);border-right:1px solid var(--rule)}
.pf button:last-child{border-right:0}
.pf button.on{color:var(--ink);background:var(--paper);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.dm{display:grid;gap:0;grid-template-columns:minmax(0,1fr)}
.dm-l,.dm-r{padding:20px 18px;min-width:0}
.vp2{position:relative;aspect-ratio:1/1;max-height:420px;width:100%;background:var(--dk);overflow:hidden}
@supports not (aspect-ratio:1/1){.vp2{height:0;padding-top:100%}}
.vp2 canvas{position:absolute;top:0;left:0;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.vp2 .tag,.vp2 .hint{position:absolute;top:10px;font:400 10px var(--mono);letter-spacing:.1em;color:var(--bone-2);pointer-events:none}
.vp2 .tag{left:12px}.vp2 .hint{right:12px}
.feats{margin-top:18px;border-top:1px solid var(--rule)}
.feats h4,.lbl{font:500 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--bronze);margin:0}
body[data-lang="zh"] .feats h4,body[data-lang="zh"] .lbl{letter-spacing:.1em}
.feats h4{padding:14px 0 6px}
.ft{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.ft b{font:500 15px var(--mono);font-weight:500}
.ft small{font:400 11px var(--mono);color:var(--mute);margin-left:4px}
.big{display:flex;align-items:baseline;gap:6px;margin-top:8px}
.big .num{font:400 clamp(80px,24vw,120px)/.95 var(--serif);letter-spacing:-.04em}
.big .of{font:400 16px var(--mono);color:var(--mute)}
.dlt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:8px;font:500 15px var(--mono)}
.dlt span{font:400 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
body[data-lang="zh"] .dlt span{letter-spacing:.06em}
.dn{color:var(--down)} .up{color:var(--accent)}
.srows{margin-top:22px;border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:1fr auto 56px;gap:12px;align-items:baseline;width:100%;min-height:56px;padding:14px 12px;border-bottom:1px solid var(--rule);font-size:15px}
.srow .mono{font-size:15px}
.srow .mono:last-child{text-align:right}
.srow.on{background:var(--paper);box-shadow:inset 0 0 0 1px var(--ink);font-weight:700}
.ph{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:30px;margin-bottom:10px}
.seg{display:flex;border:1px solid var(--ink)}
.seg button{min-height:40px;padding:0 14px;font:500 12px var(--mono);letter-spacing:.06em;border-right:1px solid var(--ink);text-align:center}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--ink);color:var(--bone)}
.ch{display:block;width:100%;height:auto}
.ch text{font:400 10px var(--mono);fill:var(--mute)}
.ch .g{stroke:var(--rule);stroke-width:1}
.ch .lb{paint-order:stroke;stroke:#f7f4ec;stroke-width:4px;stroke-linejoin:round}
.lgd{display:flex;flex-wrap:wrap;gap:6px 18px;font:400 11px var(--mono);color:var(--ink-2);margin:8px 0 4px}
.lgd i{display:inline-block;width:18px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:6px}
.lgd i.d{border-top:2px dashed var(--ink-2)} .lgd i.b{height:8px;border:0;background:rgba(31,107,92,.18)}
.pchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:14px calc(-1*18px) 0;padding:0 18px}
.pchips::-webkit-scrollbar{display:none}
.pchips button{flex:none;min-height:44px;padding:0 16px;border:1px solid var(--rule-2);font:500 13px var(--sans);background:transparent}
.pchips button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
.row2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px}
.res{margin-top:18px;padding:16px 0 0;border-top:1px solid var(--ink);font-size:16px;line-height:1.6;color:var(--ink)}
.res b{font-family:var(--mono);font-weight:500}
.sum{margin-top:26px;padding-top:16px;border-top:1px solid var(--rule)}
.sum p{margin-top:8px;color:var(--ink-2);font-size:15px}
.note{margin-top:22px}
.note textarea{display:block;width:100%;min-height:96px;margin-top:8px;padding:12px 14px;border:1px solid var(--ink);background:var(--paper);font-size:16px;line-height:1.55;border-radius:0;resize:vertical}
.note .btn{margin-top:12px}
.disc{padding:14px 18px;border-top:1px solid var(--rule);font:400 12px/1.6 var(--sans);color:var(--mute)}
@media (min-width:900px){
  .dm{grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
  .dm-l{border-right:1px solid var(--rule);padding:28px}.dm-r{padding:28px}
  .dm-l .vp2{position:sticky;top:88px}
  .pchips{margin-inline:0;padding-inline:0;flex-wrap:wrap;overflow:visible}
  .note .btn{width:auto}
}

/* trail */
.dark{background:var(--dk);color:var(--bone)}
.dark .eb{color:var(--bone-2)}
.dark .lede{color:var(--bone-2)}
.trail-grid{display:grid;gap:44px;margin-top:44px}
.cons li{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 0;border-bottom:1px solid var(--dk-rule)}
.cons li:first-child{border-top:1px solid var(--dk-rule)}
.cons b{display:block;font:500 16px var(--sans)}
.cons small{display:block;font-size:13px;color:var(--bone-2);line-height:1.45;margin-top:2px}
.sw{position:relative;flex:none;width:52px;height:28px;border:1px solid var(--bone-2)}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;background:var(--bone-2);transition:transform .2s,background .2s}
.sw.on{border-color:var(--bone)} .sw.on::after{transform:translateX(24px);background:var(--flare)}
.log li{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;padding:16px 0;border-bottom:1px solid var(--dk-rule);font-size:14px}
.log li:first-child{border-top:1px solid var(--dk-rule)}
.log .ty{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--flare)}
.log .tm{font:400 11px var(--mono);color:var(--bone-2);text-align:right}
.log .tt{grid-column:1/-1;color:var(--bone)}
.log-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.log-h span{font:400 11px var(--mono);color:var(--bone-2)}
@media (min-width:900px){.trail-grid{grid-template-columns:5fr 6fr;gap:72px}.log li{grid-template-columns:150px 96px 1fr;align-items:baseline}.log .tm{order:-1;text-align:left}.log .tt{grid-column:auto}}

/* roles & workspaces */
.roles{margin-top:40px;border-top:1px solid var(--rule)}
.role{display:grid;gap:8px;width:100%;padding:28px 0;border-bottom:1px solid var(--rule)}
.role .rt{font:400 28px/1.2 var(--serif);letter-spacing:-.01em}
body[data-lang="zh"] .role .rt{font-weight:500}
.role .rp{color:var(--ink-2);max-width:56ch}
.role .rl{font:500 13px var(--sans);margin-top:6px;border-bottom:1px solid var(--ink);align-self:flex-start;justify-self:start;padding-bottom:3px}
@media (min-width:900px){.roles{display:grid;grid-template-columns:repeat(3,1fr);column-gap:36px}.role{align-content:start;border-bottom:0;padding-right:8px}}
.rchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:32px calc(-1*var(--gut)) 0;padding:0 var(--gut)}
.rchips::-webkit-scrollbar{display:none}
.rchips button{flex:none;min-height:44px;padding:0 18px;border:1px solid var(--rule-2);font:500 13px var(--sans)}
.rchips button.on{background:var(--ink);color:var(--bone);border-color:var(--ink)}
@media (min-width:800px){.rchips{margin-inline:0;padding-inline:0}}
.wsl{margin-top:20px;border-top:1px solid var(--rule)}
.wsr{border-bottom:1px solid var(--rule);transition:opacity .2s}
.wsr.dim{opacity:.38}
.wsr>button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:14px;width:100%;min-height:72px;padding:14px 0}
.wsr .nm{font:400 clamp(22px,5.6vw,30px)/1.2 var(--serif);letter-spacing:-.01em}
.wsr .nm small{display:block;font:400 13px var(--sans);letter-spacing:0;color:var(--mute);margin-top:2px}
body[data-lang="zh"] .wsr .nm{font-weight:500}
.wsr .tg{display:flex;align-items:center;gap:10px;font:400 10px var(--mono);letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.wsr .tg i{font:300 22px/1 var(--sans);font-style:normal;color:var(--ink)}
.wsr .bd{padding:0 0 22px;color:var(--ink-2);max-width:60ch;font-size:15px}
.wsr .bd em{display:block;margin-top:10px;font:400 11px var(--mono);letter-spacing:.1em;color:var(--down);font-style:normal;text-transform:uppercase}

/* one system */
.one{display:grid;gap:0;margin-top:40px;border-top:1px solid var(--ink)}
.one>div{padding:26px 0;border-bottom:1px solid var(--rule)}
.one h3{font:400 28px/1.2 var(--serif);letter-spacing:-.01em}
body[data-lang="zh"] .one h3{font-weight:500}
.one p{margin-top:8px;color:var(--ink-2);max-width:46ch}
.one-note{margin-top:24px;font:400 12px/1.7 var(--mono);color:var(--ink-2);max-width:70ch}
@media (min-width:800px){.one{grid-template-columns:1fr 1fr}.one>div{padding:32px 40px 32px 0}}

/* access & forms */
.access-grid{display:grid;gap:40px;margin-top:8px}
.form{display:grid;gap:18px}
.form label{display:block;font:500 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--bone-2);margin-bottom:8px}
body[data-lang="zh"] .form label{letter-spacing:.08em}
.form input,.form select{display:block;width:100%;min-height:52px;padding:0 14px;border:1px solid var(--bone-2);background:transparent;color:var(--bone);font-size:16px;border-radius:0;appearance:none;-webkit-appearance:none}
.form select{background-image:linear-gradient(45deg,transparent 50%,var(--bone) 50%),linear-gradient(135deg,var(--bone) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;background-size:6px 6px;background-repeat:no-repeat}
.form select option{color:#191814}
.form input:focus,.form select:focus{outline:2px solid var(--flare);outline-offset:2px}
.ok{padding:28px 0;border-top:1px solid var(--bone-2);border-bottom:1px solid var(--bone-2)}
.ok h3{font:400 30px/1.2 var(--serif);letter-spacing:-.01em}
body[data-lang="zh"] .ok h3{font-weight:500}
.ok p{margin-top:10px;color:var(--bone-2);max-width:46ch}
@media (min-width:900px){.access-grid{grid-template-columns:6fr 5fr;gap:80px;align-items:start}}

footer{background:#12110e;color:var(--bone-2);padding:48px 0 calc(40px + env(safe-area-inset-bottom))}
footer .wm{color:var(--bone)}
footer p{margin-top:12px;max-width:60ch;font-size:14px}
footer .zh{color:var(--bone);font-family:var(--serif);font-size:18px;margin-top:14px}
footer .small{font:400 11px/1.7 var(--mono);letter-spacing:.06em;margin-top:24px;padding-top:18px;border-top:1px solid var(--dk-rule)}

/* overlays */
.ovl{position:fixed;top:0;right:0;bottom:0;left:0;z-index:100;background:var(--paper);overflow:auto;display:none;padding-bottom:env(safe-area-inset-bottom)}
.ovl.on{display:block}
.ovl-hd{display:flex;align-items:center;justify-content:space-between;height:64px;border-bottom:1px solid var(--rule)}
.ovl nav a{display:flex;align-items:baseline;justify-content:space-between;min-height:76px;padding:16px 0;border-bottom:1px solid var(--rule);font:400 clamp(28px,8vw,44px)/1.15 var(--serif);letter-spacing:-.02em}
body[data-lang="zh"] .ovl nav a{font-weight:500;letter-spacing:0}
.ovl nav a span{font:400 11px var(--mono);color:var(--mute)}
.ovl .acts{display:grid;gap:12px;margin:28px 0 32px}
.sign{padding:36px 0 48px;max-width:460px}
.sign h2{font:400 36px/1.15 var(--serif);letter-spacing:-.02em}
body[data-lang="zh"] .sign h2{font-weight:500}
.sign .sub{color:var(--mute);margin:6px 0 26px;font-size:14px}
.sign .form label{color:var(--bronze)}
.sign .form input{border-color:var(--ink);color:var(--ink)}
.sign .row{display:flex;justify-content:space-between;gap:12px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,16px);z-index:200;max-width:min(92vw,420px);background:var(--ink);color:var(--bone);padding:14px 20px;font:500 14px var(--sans);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* share */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:8px;min-height:48px;padding:0 20px 0 16px;background:var(--ink);color:var(--bone);font:700 13px var(--sans);letter-spacing:.05em;box-shadow:0 6px 24px rgba(25,24,20,.28)}
body.ovl-open .fab{display:none}
.shr{padding:28px 0 56px;max-width:520px}
.shr h2{margin-top:14px;font-size:clamp(30px,8vw,44px)}
.shr .lede{margin-top:12px;font-size:15px}
.poster{display:block;width:100%;height:auto;margin-top:22px;border:1px solid var(--rule-2);background:var(--paper-2);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
.hintline{margin-top:12px;font:400 12px/1.6 var(--mono);color:var(--bronze)}
.shr .acts{display:grid;gap:10px;margin-top:20px}
.shr textarea{display:block;width:100%;min-height:132px;margin-top:16px;padding:12px 14px;border:1px solid var(--rule-2);background:var(--paper-2);font:400 13px/1.6 var(--mono);color:var(--ink-2);border-radius:0;resize:none}
.wxo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:300;background:rgba(12,11,9,.88);color:var(--bone);display:none;padding:20px}
.wxo.on{display:block}
.wxo svg{position:absolute;top:10px;right:18px}
.wxo .tx{position:absolute;left:24px;right:24px;top:132px;text-align:right}
.wxo h3{font:400 30px/1.25 var(--serif);letter-spacing:-.01em}
.wxo p{margin-top:10px;color:var(--bone-2);font-size:15px}
.wxo .btn{position:absolute;left:24px;right:24px;bottom:calc(32px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){*{transition-duration:.001s!important}}
</style>

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let x=a;x=Math.imul(x^x>>>15,x|1);x^=x+Math.imul(x^x>>>7,x|61);return((x^x>>>14)>>>0)/4294967296;};}

    }

function project(){

  return [0,30,60,90].map(d=>{const h=d/90,nat=clamp(cur+slope*d/30,0,100),gain=dT*Math.pow(h,.8),u=d?uT*(.25+.75*h):0;return{d,nat,pw:clamp(nat+gain,0,100),u};});
}

/* ---- poster (canvas → PNG, long-press in WeChat to send / save) ---- */
function cssVar(n){return getComputedStyle(document.body).getPropertyValue(n).trim();}
function spaced(c,text,x,y,sp,align){
  const ch=Array.from(text);let w=-sp;ch.forEach(function(g){w+=c.measureText(g).width+sp;});
  let x0=align==='right'?x-w:x;ch.forEach(function(g){c.fillText(g,x0,y);x0+=c.measureText(g).width+sp;});
}
function wrap(c,text,maxW,maxLines){
  const toks=lang==='zh'?Array.from(text):text.split(/(\s+)/),out=[];let line='';
  toks.forEach(function(tk){const test=line+tk;if(c.measureText(test).width>maxW&&line){out.push(line.replace(/\s+$/,''));line=tk.replace(/^\s+/,'');}else line=test;});
  if(line)out.push(line);return out.slice(0,maxLines);
}
function drawOrganTo(c,x,y,w,h,p,mode){
  const N=2400,pts=samples(p.organ,N),hm=heat(pts,p.seed,mode,.35+(100-p.idx['sfb'[mode]])/60),P=[];
  const cx=x+w/2,cy=y+h/2-10,sc=Math.min(w,h)*.46,yaw=.7,cw=Math.cos(yaw),sw=Math.sin(yaw),ct=Math.cos(.28),st=Math.sin(.28);
  for(let k=0;k<N;k++){const a=pts[3*k],b=pts[3*k+1],z=pts[3*k+2],x1=a*cw+z*sw,z1=-a*sw+z*cw,y1=b*ct-z1*st,z2=b*st+z1*ct;P.push([z2,x1,y1,hm[k]]);}
  P.sort(function(u,v){return v[0]-u[0];});
  c.save();c.beginPath();c.rect(x,y,w,h);c.clip();
  P.forEach(function(q){const pp=1/(1+q[0]*.32),dep=clamp(.5-q[0]*.5,0,1);c.globalAlpha=.3+.65*dep;c.fillStyle=LUT[(q[3]*63)|0];c.beginPath();c.arc(cx+q[1]*sc*pp,cy-q[2]*sc*pp,1.1+1.9*dep,0,6.2832);c.fill();});

function drawChartTo(c,x,y,w,h,pts){

  let mn=Math.max(0,Math.floor((Math.min.apply(null,vals)-3)/5)*5),mx=Math.min(100,Math.ceil((Math.max.apply(null,vals)+3)/5)*5);if(mx-mn<10)mx=mn+10;
  const X=function(d){return x+w*d/90;},Y=function(v){return y+h*(1-(v-mn)/(mx-mn));};
  c.strokeStyle='#d6cfbe';c.lineWidth=1;[mn,(mn+mx)/2,mx].forEach(function(v){c.beginPath();c.moveTo(x,Y(v));c.lineTo(x+w,Y(v));c.stroke();});
  c.fillStyle='rgba(31,107,92,.16)';c.beginPath();pts.forEach(function(q,i){if(i)c.lineTo(X(q.d),Y(q.pw+q.u));else c.moveTo(X(q.d),Y(q.pw+q.u));});
  pts.slice().reverse().forEach(function(q){c.lineTo(X(q.d),Y(q.pw-q.u));});c.closePath();c.fill();
  const ln=function(k){c.beginPath();pts.forEach(function(q,i){if(i)c.lineTo(X(q.d),Y(q[k]));else c.moveTo(X(q.d),Y(q[k]));});c.stroke();};
  c.setLineDash([8,7]);c.strokeStyle='#55524a';c.lineWidth=2.4;ln('nat');c.setLineDash([]);c.strokeStyle='#1f6b5c';c.lineWidth=4;c.lineJoin='round';ln('pw');
  const s=pts.filter(function(q){return q.d===D.hz;})[0];

  c.fillStyle='#f0ece2';c.strokeStyle='#55524a';c.lineWidth=3;c.beginPath();c.arc(X(s.d),Y(s.nat),6,0,6.2832);c.fill();c.stroke();
  c.font='500 22px '+cssVar('--mono');c.textAlign='center';
  const lx=clamp(X(s.d),24,x+w-24);c.fillStyle='#1f6b5c';c.fillText(f1(s.pw),lx,Y(s.pw+s.u)-12);c.fillStyle='#55524a';c.fillText(f1(s.nat),lx,Y(s.nat)+32);c.textAlign='left';

function drawQR(c,text,x,y,size){

  if(d.hm!==undefined){heroMode=+d.hm;HERO&&HERO.setMode(heroMode);renderHeroModes();return;}
  if(d.pf!==undefined){D.pi=+d.pf;renderHead();renderStates();renderProj();mountCard();const p=PR[D.pi];logT('ACCESS',`Viewed ${p.id} digital organ (${ORG[p.organ].n.en.toLowerCase()})`,`查看 ${p.id} 数字器官（${ORG[p.organ].n.zh}）`);return;}
  if(d.st){D.st=d.st;CARD&&CARD.setMode({s:0,f:1,b:2}[D.st]);renderStates();renderProj();return;}
  if(d.hz){D.hz=+d.hz;renderProj();return;}
  if(d.path){D.path=d.path;renderProj();return;}
  if(d.int!==undefined){D.inten=+d.int;renderProj();return;}
  if(d.cons){CONSENT[d.cons]=!CONSENT[d.cons];const on=CONSENT[d.cons],n={doc:['Physician access','医生访问'],res:['Research use','研究授权'],mod:['Model improvement','模型改进']}[d.cons];logT('CONSENT',`Consent ${on?'granted':'withdrawn'}: ${n[0]}`,`${on?'已授予':'已撤回'}授权：${n[1]}`);return;}

  if(d.rf){roleF=d.rf;renderWS();return;}

  if(d.act==='access'){goTo('#access');return;}
  if(d.act==='reqfrom'){goTo('#access');return;}
  if(d.act==='forgot'){toast(t('toast.forgot'));return;}
  if(d.act==='save'){
    const txt=$('#note').value.trim(),p=PR[D.pi],pts=project(),s=pts.find(q=>q.d===D.hz),P0=PATHS[D.path],k=D.st;
    if(!txt){toast(t('toast.note'));$('#note').focus();return;}
    logT('SIM',`${P0.n.en}, ${INT[D.inten].n.en.toLowerCase()} intensity · ${p.id} ${ST[k].en.toLowerCase()} at ${D.hz}D → ${f1(s.pw)} (±${f1(s.u)})`,`${P0.n.zh}，强度${INT[D.inten].n.zh} · ${p.id} ${ST[k].zh} ${D.hz} 天 → ${f1(s.pw)}（±${f1(s.u)}）`);
    logT('NOTE',txt,txt);$('#note').value='';toast(t('toast.saved'));return;
  }
});
document.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='signForm'){signed=true;closeOvl();renderHdr();logT('ACCESS','Signed in: Dr. Li, cardiology (demo)','登录：李医生，心内科（演示）');toast(t('toast.signed'));goTo('#demo');}
  if(e.target.id==='accessForm'){
    const em=$('#ae');if(!/^\S+@\S+\.\S+$/.test(em.value.trim())){em.setCustomValidity(t('a.bad'));em.reportValidity();em.setCustomValidity('');em.focus();return;}
    $('#accessBox').innerHTML=`<div class="ok"><h3>${t('a.ok')}</h3><p>${t('a.okp')}</p></div>`;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOvl();});
